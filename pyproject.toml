[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mdkdebug"
version = "0.2.31"
description = "可被 AI 工具调用的 Keil uVision 调试服务（MCP Server）——UVSOCK 在线调试 + UV4 编译烧录闭环"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["keil", "uvision", "mcp", "model-context-protocol", "uvsock", "debug", "debugger", "embedded", "stm32", "cortex-m", "arm", "reverse-engineering", "ai-agent"]
authors = [{ name = "mdkdebug" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Embedded Systems",
    "Typing :: Typed",
]
dependencies = [
    "mcp>=2.0",
    "pydantic>=2.8",
    "pyelftools>=0.30",
    "capstone>=5.0",
    # 代码结构索引层（可选能力：缺失时 code 组工具如实报 parser-missing，不降级成 grep）
    "tree-sitter>=0.26",
    "tree-sitter-c>=0.24",
    "tree-sitter-cpp>=0.23",
]

# 可选依赖（批次107）。**不装也能用**：recover_emulate 在缺失时如实报
# supported=false 并给出安装提示，绝不降级成静态猜测（同 tree-sitter 的口径）。
[project.optional-dependencies]
emu = ["unicorn>=2.0"]

[project.scripts]
mdkdebug = "mdkdebug.cli:main"

# 包页面的「主页 / 源码 / 问题」链接。主源是 gitee，GitHub 只是它的自动镜像，
# 所以四个 URL 全部指向 gitee（Mirror 单独给出 GitHub，避免第三方站把镜像当主源）。
[project.urls]
Homepage = "https://gitee.com/xw19981010/mdk_agent_mcp"
Repository = "https://gitee.com/xw19981010/mdk_agent_mcp"
Issues = "https://gitee.com/xw19981010/mdk_agent_mcp/issues"
Documentation = "https://gitee.com/xw19981010/mdk_agent_mcp#readme"
Mirror = "https://github.com/xw1998/mdk_agent_mcp"

[tool.setuptools]
# 子包必须显式列出来（原来只有 mdkdebug，viz 与 codeindex 都不会被装进 wheel）：
# viz = 可视化渲染；codeindex = 代码结构索引（批次68）。
packages = ["mdkdebug", "mdkdebug.viz", "mdkdebug.codeindex"]

[tool.setuptools.package-data]
mdkdebug = ["py.typed"]
